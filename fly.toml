# Replace "saber-bldgaudittool" with your chosen app name (must be globally unique on Fly.io)
app = "saber-bldgaudittool"
primary_region = "den"

[build]
  dockerfile = "Dockerfile"

[env]
  # User-uploaded utility CSVs are written here — backed by the persistent volume below.
  # Pre-seeded project data in BldgAuditToolSimple_v1/Projects stays in the image (read-only).
  UPLOADS_DIR = "/data/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 10
    soft_limit = 5

[[mounts]]
  source = "user_uploads"
  destination = "/data/uploads"
  initial_size = "1gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
